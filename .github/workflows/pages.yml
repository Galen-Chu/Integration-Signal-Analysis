name: Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Pages 部署：錄製頁需要 secure context（https）——GitHub Pages 是零成本解，
# 讓 app/recorder.html 在真機（iOS Safari/Android Chrome）拿到 DeviceMotion 事件.
# 注意 permissions 只能用 GitHub 認可的鍵（contents/pages/id-token…）——
# 曾誤放 "administration: write" 導致整個 workflow 被 GitHub 拒收（startup_failure、0 jobs）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy recorder app
    runs-on: ubuntu-latest
    # 雙保險：Dependabot 分支改到 workflow 檔時曾繞過 branches 過濾器觸發本檔
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: app
    - id: deployment
      uses: actions/deploy-pages@v4
