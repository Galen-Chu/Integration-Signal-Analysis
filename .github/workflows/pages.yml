name: Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Pages 部署：錄製頁需要 secure context（https）——GitHub Pages 是零成本解，
# 讓 app/recorder.html 在真機（iOS Safari/Android Chrome）拿到 DeviceMotion 事件
permissions:
  contents: read
  pages: write
  id-token: write
  administration: write  # configure-pages 的 enablement 需要它開啟 Pages；若組織政策不允許，請在 Settings→Pages 手動開啟

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy recorder app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/configure-pages@v5
      with:
        enablement: true
    - uses: actions/upload-pages-artifact@v3
      with:
        path: app
    - id: deployment
      uses: actions/deploy-pages@v4
