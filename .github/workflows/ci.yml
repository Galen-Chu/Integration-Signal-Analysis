name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install ruff
      run: pip install ruff
    - name: Ruff check
      run: ruff check .
    - name: Ruff format check
      run: ruff format --check .

  tests:
    name: Tests (pytest, synthetic data)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest -v

  recorder-logic:
    name: Recorder core (node)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Recorder core logic tests
      run: node app/test/recorder_core.test.mjs
